<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng Dụng Quản Lý Chi Tiêu Cá Nhân</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>💰 QUẢN LÝ CHI TIÊU CÁ NHÂN</h2>
        
        <div class="balance-container">
            <h4>Số Dư Hiện Tại</h4>
            <h1 id="balance">0 VND</h1>
        </div>

        <div class="inc-exp-container">
            <div>
                <h4>Thu Nhập</h4>
                <p id="money-plus" class="money plus">+0 VND</p>
            </div>
            <div>
                <h4>Chi Phí</h4>
                <p id="money-minus" class="money minus">-0 VND</p>
            </div>
        </div>

        <h3>📜 Lịch Sử Giao Dịch</h3>
        <ul id="list" class="list">
            </ul>

        <h3>➕ Thêm Giao Dịch Mới</h3>
        <form id="form">
            <div class="form-control">
                <label for="text">Tên giao dịch</label>
                <input type="text" id="text" placeholder="Ví dụ: Ăn sáng, Lương tháng..." required />
            </div>
            <div class="form-control">
                <label for="amount">Số tiền (VND)</label>
                <input type="number" id="amount" placeholder="Nhập số tiền..." required />
            </div>
            <div class="form-control radio-group">
                <label>
                    <input type="radio" name="type" value="income" checked> Thu Nhập
                </label>
                <label>
                    <input type="radio" name="type" value="expense"> Chi Phí
                </label>
            </div>
            <button class="btn">Thêm Giao Dịch</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
